<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth - EMS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1117;
      color: #fff;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    /* --- LOGIN STYLES --- */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #ffffff;
      padding: 30px;
      width: 350px;
      border-radius: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .login-form .flex-column > label {
      color: #151717;
      font-weight: 600;
    }

    .login-form .inputForm {
      border: 1.5px solid #ecedec;
      border-radius: 10px;
      height: 45px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      transition: 0.2s ease-in-out;
    }

    .login-form .input {
      margin-left: 10px;
      border: none;
      width: 85%;
      height: 100%;
      outline: none;
      color: #151717;
    }

    .login-form .inputForm:focus-within {
      border: 1.5px solid #2d79f3;
    }

    .login-form .flex-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .login-form .flex-row > div > label {
      font-size: 14px;
      color: black;
    }

    .login-form .span-btn {
      font-size: 14px;
      color: #2d79f3;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .login-form .button-submit {
      margin: 15px 0 10px 0;
      background-color: #151717;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: 500;
      border-radius: 10px;
      height: 45px;
      width: 100%;
      cursor: pointer;
    }

    .login-form .p {
      text-align: center;
      color: black;
      font-size: 14px;
      margin: 5px 0;
    }

    /* --- REGISTER STYLES --- */
    .register-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 350px;
      background-color: #fff;
      padding: 25px;
      border-radius: 20px;
      position: relative;
      box-sizing: border-box;
    }

    .register-form .title {
      font-size: 26px;
      color: royalblue;
      font-weight: 600;
      position: relative;
      display: flex;
      align-items: center;
      padding-left: 25px;
      margin: 0;
    }

    .register-form .title::before, .register-form .title::after {
      position: absolute;
      content: "";
      border-radius: 50%;
      left: 0px;
    }

    .register-form .title::before {
      width: 16px;
      height: 16px;
      background-color: royalblue;
    }

    .register-form .title::after {
      width: 16px;
      height: 16px;
      background-color: royalblue;
      animation: pulse 1s linear infinite;
    }

    .register-form .message, .register-form .signin {
      color: rgba(88, 87, 87, 0.822);
      font-size: 14px;
      margin: 2px 0;
    }

    .register-form .signin {
      text-align: center;
    }

    .register-form .flex {
      display: flex;
      width: 100%;
      gap: 6px;
    }

    .register-form label {
      position: relative;
      width: 100%;
    }

    .register-form label .input {
      width: 100%;
      padding: 10px;
      outline: 0;
      border: 1px solid rgba(105, 105, 105, 0.397);
      border-radius: 10px;
      box-sizing: border-box;
    }

    .register-form label .input + span {
      position: absolute;
      left: 10px;
      top: 10px;
      color: grey;
      font-size: 0.9em;
      transition: 0.3s ease;
      pointer-events: none;
    }

    .register-form label .input:focus + span,
    .register-form label .input:not(:placeholder-shown) + span {
      top: -8px;
      left: 8px;
      font-size: 0.7em;
      font-weight: 600;
      background-color: white;
      padding: 0 4px;
      color: royalblue;
    }

    .register-form .submit {
      border: none;
      background-color: royalblue;
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-form .submit:hover {
      background-color: rgb(56, 90, 194);
    }

    @keyframes pulse {
      from { transform: scale(0.9); opacity: 1; }
      to { transform: scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- LOGIN CARD -->
  <form id="loginCard" class="login-form" onsubmit="handleLogin(event)">
    <div class="flex-column"><label>Email</label></div>
    <div class="inputForm">
      <svg height="20" viewBox="0 0 32 32" width="20"><path fill="#666" d="m30.853 13.87a15 15 0 0 0 -29.729 4.082 15.1 15.1 0 0 0 12.876 12.918 15.6 15.6 0 0 0 2.016.13 14.85 14.85 0 0 0 7.715-2.145 1 1 0 1 0 -1.031-1.711 13.007 13.007 0 1 1 5.458-6.529 2.149 2.149 0 0 1 -4.158-.759v-10.856a1 1 0 0 0 -2 0v1.726a8 8 0 1 0 .2 10.325 4.135 4.135 0 0 0 7.83.274 15.2 15.2 0 0 0 .823-7.455zm-14.853 8.13a6 6 0 1 1 6-6 6.006 6.006 0 0 1 -6 6z"/></svg>
      <input type="text" class="input" id="loginEmail" placeholder="Enter your Email" required>
    </div>
    
    <div class="flex-column"><label>Password</label></div>
    <div class="inputForm">
      <svg height="20" viewBox="-64 0 512 512" width="20"><path fill="#666" d="m336 512h-288c-26.453125 0-48-21.523438-48-48v-224c0-26.476562 21.546875-48 48-48h288c26.453125 0 48 21.523438 48 48v224c0 26.476562-21.546875 48-48 48zm-288-288c-8.8125 0-16 7.167969-16 16v224c0 8.832031 7.1875 16 16 16h288c8.8125 0 16-7.167969 16-16v-224c0-8.832031-7.1875-16-16-16zm0 0"/></svg>        
      <input type="password" class="input" id="loginPassword" placeholder="Enter your Password" required>
    </div>
    
    <div class="flex-row">
      <div>
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
      </div>
      <span class="span-btn">Forgot password?</span>
    </div>


    <button type="submit" class="button-submit">Submit</button>
    <p class="p">Don't have an account? <button type="button" class="span-btn" onclick="toggleForm()">Sign Up</button></p>
  </form>

  <!-- REGISTER CARD -->
  <form id="registerCard" class="register-form hidden" onsubmit="handleRegister(event)">
    <p class="title">Register</p>
    <p class="message">Signup now and get full access to our app.</p>
    
    <div class="flex">
      <label>
        <input required placeholder=" " type="text" class="input" id="regFname">
        <span>Firstname</span>
      </label>
      <label>
        <input required placeholder=" " type="text" class="input" id="regLname">
        <span>Lastname</span>
      </label>
    </div>          
            
    <label>
      <input required placeholder=" " type="email" class="input" id="regEmail">
      <span>Email</span>
    </label> 
        
    <label>
      <input required placeholder=" " type="password" class="input" id="regPassword">
      <span>Password</span>
    </label>

    <label>
      <input required placeholder=" " type="password" class="input" id="regCpassword">
      <span>Confirm password</span>
    </label>

    <button type="submit" class="button-submit">Submit</button>
    <p class="signin">Already have an account? <button type="button" class="span-btn" onclick="toggleForm()">Sign In</button></p>
  </form>

  <script>
    function toggleForm() {
      document.getElementById('loginCard').classList.toggle('hidden');
      document.getElementById('registerCard').classList.toggle('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      alert("Login Successful!");
      window.location.href = "dashboard.html"; 
    }

    function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('regPassword').value;
      const cpass = document.getElementById('regCpassword').value;

      if (pass !== cpass) {
        alert("Passwords do not match!");
        return;
      }
      alert("Registration Successful!");
      window.location.href = "dashboard.html"; 
    }
  </script>
</body>
</html>
